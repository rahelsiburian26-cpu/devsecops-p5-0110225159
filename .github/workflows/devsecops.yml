name: DevSecOps Pipeline – TaskFlow API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — BUILD & TEST
  # Installs dependencies, runs unit tests, and collects coverage.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --tb=short \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — SAST SCAN (Bandit)
  # Runs Bandit static analysis on the application source code.
  # Depends on the build job succeeding first (Quality Gate).
  # ────────────────────────────────────────────────────────────────────────────
  sast-scan:
    name: SAST Scan – Bandit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit[toml]>=1.7.5

      - name: Run Bandit SAST scan
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            --exit-zero
          bandit -r app/ \
            -f txt \
            --severity-level medium \
            --confidence-level medium

      - name: Check for HIGH severity issues (Quality Gate)
        run: |
          python - <<'EOF'
          import json, sys

          with open("bandit-report.json") as f:
              report = json.load(f)

          results = report.get("results", [])
          high_issues = [
              r for r in results
              if r.get("issue_severity") == "HIGH"
          ]

          print(f"Total issues found : {len(results)}")
          print(f"HIGH severity      : {len(high_issues)}")

          if high_issues:
              print("\n[QUALITY GATE FAILED] HIGH severity vulnerabilities detected:")
              for issue in high_issues:
                  print(f"  - {issue['filename']}:{issue['line_number']} — {issue['issue_text']}")
              sys.exit(1)
          else:
              print("\n[QUALITY GATE PASSED] No HIGH severity issues found.")
          EOF

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json
          retention-days: 30
